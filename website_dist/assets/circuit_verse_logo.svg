<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0b0e14" />
  <circle cx="50" cy="50" r="42" stroke="url(#neonGlow)" stroke-width="2" fill="none" opacity="0.4" />
  <!-- Circuit Nodes & Traces -->
  <path d="M15,50 L35,50 L45,30 L65,30 L75,45 L85,45" fill="none" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow)" />
  <path d="M20,65 L35,65 L50,80 L70,80 L80,60" fill="none" stroke="#ff007f" stroke-width="2" opacity="0.7" />
  <circle cx="35" cy="50" r="3.5" fill="#00f0ff" />
  <circle cx="65" cy="30" r="3.5" fill="#00f0ff" />
  <circle cx="50" cy="80" r="3" fill="#ff007f" />
  <!-- Central 'CV' Monogram -->
  <text x="50" y="58" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" filter="url(#glow)">CV</text>
</svg>
