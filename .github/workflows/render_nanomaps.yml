# GitHub action to autorender nanomaps outside the game
# This kills off the awful verb we have that takes a full 50 seconds and hangs the whole server
# The file names and locations are VERY important here
# DO NOT EDIT THIS UNLESS YOU KNOW WHAT YOU ARE DOING
# -aa
name: 'Render Nanomaps'
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate_maps:
    name: 'Generate NanoMaps'
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App Token (if configured)
        id: create_token
        if: ${{ secrets.APP_ID != '' && secrets.PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Set Auth Token
        run: |
          if [ -n "${{ steps.create_token.outputs.token }}" ]; then
            echo "GH_TOKEN=${{ steps.create_token.outputs.token }}" >> "$GITHUB_ENV"
          else
            echo "GH_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_ENV"
          fi

      - name: 'Update Branch'
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.create_token.outputs.token || secrets.GITHUB_TOKEN }}
          ref: main

      - name: Branch
        run: |
          git branch -f nanomap-render
          git checkout nanomap-render
          git reset --hard origin/main

      - name: 'Generate Maps'
        run: |
          chmod +x ./tools/github-actions/dmm-tools-para
          chmod +x ./tools/github-actions/nanomap-renderer-invoker.sh
          ./tools/github-actions/nanomap-renderer-invoker.sh

      - name: 'Commit Maps and open PR'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "NanoMap Generation"
          git pull origin main
          git commit -m "NanoMap Auto-Update ($(date))" -a || true
          git push -f -u origin nanomap-render
          result=$(gh pr create -t "Automatic NanoMap Update" -b "This pull request updates the server NanoMaps. Please review the diff images before merging." -l "NanoMaps" -H "nanomap-render" -B "main" 2>&1) || true
          echo "$result"
          if echo "$result" | grep -q "No commits between main and nanomap-render"; then
            echo "No NanoMaps update required, skipping."
          fi
